<header class="main_header">
    <!-- logo -->
    <a class="header_logo" href="/">
      <img src="/assets/images/logo.svg" alt="logo">
    </a>
    
    <!-- pc -->
    <div class="header_operate">
        <!-- menu -->
        <nav class="header_menu">
            <a class="lang index_link" key="index_link" href="/">首頁</a>
            <a class="lang service_link" key="service_link" href="/pages/service.html">人工智能應用</a>

                  <div class="lang_hr"></div>
                  <div class="lang_option lang_en" onclick="changeLang('en')">EN</div>
                </div>
            </div>

      </div>

        <span class="hide_en">EN</span>
      </div>
    </div>

<script>
  // 判斷選單 active 狀態
  if (location.pathname === '/') {
    $(".index_link").addClass("active");  
  }
  if (location.pathname === '/pages/service.html') {
    $(".service_link").addClass("active");  
  }
  if (location.pathname === '/pages/cdp.html') {
    $(".cdp_link").addClass("active");

  if (location.pathname === '/pages/about.html') {
    $(".about_link").addClass("active");

  if (location.pathname === '/pages/contact.html') {
    $(".contact_link").addClass("active");  
  }
</script>
