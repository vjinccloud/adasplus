<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/favicon.ico">
    <title>ADASPLUS CDP</title>
    <!-- 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+TC:wght@100..900&family=Roboto&display=swap" rel="stylesheet">
    <!-- 共用樣式 -->
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <noscript>您的瀏覽器不支援JavaScript功能，若網頁功能無法正常使用時，請開啟瀏覽器JavaScript狀態</noscript>
  <body>
    <div class="adas_view">
      <!-- header -->
      <div class="headerView"></div>

       <!-- main -->
       <main>
        <!-- cdp banner -->
        <div class="cdp_banner">
          <img src="/assets/images/cdp-banner.png" alt="">
          <div class="cdp_banner_title">
            <div class="en_title hide_en">CDP</div>
            <div class="zh_title hide_en">協同設計平台</div>
            <div class="zh_title hide_zh">CDP</div>
          </div>
        </div>
         <!-- cdp description -->
        <div class="cdp_description">
          <div class="cdp_description_content">
            <h1 class="lang" key="cdp_title">協同設計平台CDP</h1>
            <p class="lang" key="cdp_text_1">啟簡在半導體相關業務上開發了兩項技術:</p>
            <li class="lang" key="cdp_text_2">協同設計平台 (CDP, COLLABORATIVE DESIGN PLATFORM)</li>
            <p class="lang pl" key="cdp_text_3"> 協助 IC 設計公司建立優質的設計開發平台</p>
            <li class="lang" key="cdp_text_4">邊緣運算 ASIC (AiDAS, AI-based DEVICE ACCELERATE SYSTEM)</li>
            <p class="lang last pl" key="cdp_text_5"> 提供系統廠商具有競爭力的ASIC解決方案</p>
          </div>
          <img src="/assets/images/cdp-description.png" alt="">
        </div>

         <!-- cdp content -->
        <div class="cdp_content">
          <h1 class="lang" key="cdp_content_title_1">協同設計平台（CDP）</h1>
          <img class="cdp_content_img hide_en" src="/assets/images/cdp-content.svg" alt="">
          <img class="cdp_content_img hide_zh" src="/assets/images/cdp-content-en.svg" alt="">
          <h1 class="lang" key="cdp_content_title_2">AI邊緣運算ASIC（AiDAS）</h1>
          <img class="hide_en" src="/assets/images/cdp-asic.png" alt="">
          <img class="hide_zh" src="/assets/images/cdp-asic-en.png" alt="">
        </div>

        <!-- contact -->
        <div class="contactView"></div>
      </main>

      <!-- footer -->
      <div class="footerView"></div>
    </div>
    <!-- jquery  -->
    <script src="https://code.jquery.com/jquery-3.6.3.min.js" integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
    <!-- 共用方法 -->
    <script src="/assets/js/common.js"></script>
    <!-- 載入元件 -->
    <script src="/assets/js/loadCompontents.js"></script> 
    <!-- 語言切換 -->
    <script src="/assets/js/language.js"></script>
  </body>
</html>
